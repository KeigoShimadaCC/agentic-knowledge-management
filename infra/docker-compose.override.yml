services:
  api:
    build:
      target: development
    volumes:
      - ../services/api:/app
      - library-data:/library
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DEBUG: "true"

  web:
    build:
      target: development
    volumes:
      - ../apps/web:/app
      - /app/node_modules
      - /app/.next
    command: pnpm dev
