[project]
name = "kos-tests"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "asyncpg>=0.29",
    "kos-api",
    "kos-worker",
]

[tool.uv.sources]
kos-api = { path = "../services/api" }
kos-worker = { path = "../services/worker" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# See dummy_pkg/README.md; this placeholder lets Hatchling build the tests workspace.
packages = ["dummy_pkg"]

[dependency-groups]
dev = [
    "reportlab>=4.0",
    "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["api", "unit", "worker"]
