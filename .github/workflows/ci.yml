name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages --all-extras
      - run: pnpm lint
      - run: pnpm typecheck
      - run: uv run --project services/api --extra dev ruff check services/api services/worker tests
      - run: uv run --project services/api --extra dev ruff format --check services/api services/worker tests

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: knowledgeos
          POSTGRES_USER: kos
          POSTGRES_PASSWORD: kospass
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U kos -d knowledgeos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.9.0
        ports:
          - 6333:6333
          - 6334:6334
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages --all-extras
      - run: make test-api
      - run: make test-worker
      - run: make test-mcp

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make test-unit

  e2e:
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages --all-extras
      - run: pnpm --dir tests/e2e exec playwright install chromium --with-deps
      - run: cp infra/.env.example infra/.env && sed -i "s|/Users/YOUR_USERNAME|$HOME|g" infra/.env
      - run: mkdir -p tests/e2e/.tmp/library
      - run: |
          if grep -q '^OPENAI_API_KEY=' infra/.env; then
            sed -i.bak 's/^OPENAI_API_KEY=.*/OPENAI_API_KEY=sk-test-stub/' infra/.env
          else
            echo 'OPENAI_API_KEY=sk-test-stub' >> infra/.env
          fi
      - run: LIBRARY_ROOT=$PWD/tests/e2e/.tmp/library docker compose -f infra/docker-compose.yml up -d --build
      - run: make test-e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
