name: KnowledgeOS

options:
  bundleIdPrefix: com.knowledgeos
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  KnowledgeOS:
    type: application
    platform: iOS
    sources:
      - path: KnowledgeOS
        excludes:
          - Resources/Info.plist
    resources:
      - path: KnowledgeOS/Resources/Assets.xcassets
    info:
      path: KnowledgeOS/Resources/Info.plist
      properties:
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.knowledgeos.ios.syncqueue.refresh
          - com.knowledgeos.ios.syncqueue.processing
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
            local:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
            ts.net:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.knowledgeos.ios

  KnowledgeOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KnowledgeOSTests
    resources:
      - path: KnowledgeOSTests/Fixtures
    dependencies:
      - target: KnowledgeOS
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.knowledgeos.ios.tests
        GENERATE_INFOPLIST_FILE: YES

  KnowledgeOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KnowledgeOSUITests
    dependencies:
      - target: KnowledgeOS
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.knowledgeos.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
