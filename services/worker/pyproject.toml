[project]
name = "kos-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    'rq>=1.16',
    'psycopg2-binary>=2.9',
    'sqlalchemy>=2.0',
    'redis[hiredis]>=5.0',
    'aiofiles>=23.2',
    'pypdf>=4.0',
    'pillow>=10.0',
    'filetype>=1.2',
    'httpx>=0.27',
    'beautifulsoup4>=4.12',
    'youtube-transcript-api>=1.2,<2',
    "openai>=1.0",
    "qdrant-client>=1.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "reportlab>=4.0",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kos_worker"]
