x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: kos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowledgeos}
      POSTGRES_USER: ${POSTGRES_USER:-kos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kospass}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kos} -d ${POSTGRES_DB:-knowledgeos}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: kos-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging: *default-logging

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: kos-qdrant
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
      target: development
    container_name: kos-api
    restart: unless-stopped
    working_dir: /app
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kos}:${POSTGRES_PASSWORD:-kospass}@postgres:5432/${POSTGRES_DB:-knowledgeos}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      LIBRARY_ROOT: /library
      DEBUG: "true"
      # Seed [Demo] pages/source/chat on startup (login: DEMO_SEED_EMAIL / DEMO_SEED_PASSWORD).
      SEED_DEMO_EXAMPLES: "true"
    volumes:
      - ../services/api:/app
      - library-data:/library
    command:
      - sh
      - -c
      - >-
          uv run alembic upgrade head &&
          exec uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 90s
    logging: *default-logging

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
      target: development
    container_name: kos-worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kos}:${POSTGRES_PASSWORD:-kospass}@postgres:5432/${POSTGRES_DB:-knowledgeos}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      LIBRARY_ROOT: /library
    volumes:
      - ../services/api:/app/services/api
      - ../services/worker:/app/services/worker
      - library-data:/library
    command:
      - sh
      - -c
      - "exec .venv/bin/rq worker kos-ingest --url $$REDIS_URL"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
    logging: *default-logging

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      target: development
    container_name: kos-web
    restart: unless-stopped
    working_dir: /app/apps/web
    environment:
      # Host browsers call the published API port (8001 maps to api:8000).
      NEXT_PUBLIC_API_URL: http://localhost:8001
      API_URL: http://api:8000
    volumes:
      - ../apps/web:/app/apps/web
    command: ["pnpm", "dev"]
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    logging: *default-logging

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  library-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${LIBRARY_ROOT:-/tmp/kos-library}
